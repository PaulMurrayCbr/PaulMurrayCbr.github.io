    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;
        }

        /*
        A dice-dropzone has a number of "die" spans in it, each with an image.
        */

        .dice-dropzone {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;

            border: 2px dashed #6c757d;
            border-radius: 0.5rem;
            padding: 0.5rem;

            min-width: 4rem;
            min-height: 4rem;

            touch-action: none;

        }

        #dice-selection-area {
            border: 2px solid #495057;
            border-radius: 0.75rem;
            padding: .5rem;
        }

        #dice-box, #assigned-dice {
        }

        #assigned-dice {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;

        }


        #assigned-dice .die-slot {
            display: grid;
            min-height: 4.5rem;
        }

        #assigned-dice .die-slot * {
            display: inline-block;
            grid-area: 1 / 1;
        }


        #assigned-dice .die-slot .dice-dropzone .die {
            margin-top: .75rem;
        }

        #assigned-dice .die-slot .slot-name {
            place-self: start center;

            font-weight: bold;
            text-align: center;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            touch-action: none;
        }


        /* the dice image */
        .die {
            display: inline-block;
            background: #F0F0F0;
            padding: 0.25rem;
            opacity: 1;

            border-radius: 0.5rem;

            touch-action: none;
            user-select: none;

            --hue: 0;
            --sat: 80%;
            --lite: 80%;


        }


        .die.d6 {
            background: hsl(calc(var(--hue) + 0) var(--sat) var(--lite));
        }

        .die.d8 {
            background: hsl(calc(var(--hue) + 72) var(--sat) var(--lite));
        }

        .die.d10 {
            background: hsl(calc(var(--hue) + 144) var(--sat) var(--lite));
        }

        .die.d12 {
            background: hsl(calc(var(--hue) + 216) var(--sat) var(--lite));
        }

        .die.d20 {
            background: hsl(calc(var(--hue) + 288) var(--sat) var(--lite));
        }

        .die img {
            width: 2rem;
            height: 2rem;
            object-fit: contain;
            touch-action: none;
        }

        .dragging {
            position: fixed;
            z-index: 1000;

            pointer-events: none;

            transform: scale(1.1);
            opacity: 0.85;
        }

        .dice-dropzone.candrop {
            border-color: var(--bs-primary) !important;
            background-color: var(--bs-primary-bg-subtle);
            box-shadow: 0 0 0 0.2rem var(--bs-primary-border-subtle);
        }

        .die-rolls {
            font-size: small;
            margin-right: 0.25rem;
        }

        .die-roll {

        }

        .die-roll.not-used {
            text-decoration: line-through;
        }

        .dmg, .amt {
            font-weight: bold;
        }

        .bullet-P, .bullet-2, .bullet-B {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 1.4rem;
            height: 1.4rem;
            border-radius: 50%;

            font-weight: bold;
            font-size: 0.8rem;
            line-height: 1;

            margin-left: .25rem;

            border: thin solid black;
        }

        .bullet-P, .bullet-B {
            background: black;
            color: white;
        }

        .bullet-P::before {
            content: "P";
        }

        .bullet-2::before {
            content: "2";
        }

        .bullet-B::before {
            content: "B";
        }

    </style>

    <script>
        const state = {
            level: 1,
            bursarRelationship: "neutral",
            diceAt: {},
            slotContains: {} // not including the 'box' slot
        };

        const diceslot = {
            box: Symbol("box"),
            melee: Symbol("melee"),
            missile: Symbol("missile"),
            armour: Symbol("armour"),
            misc: Symbol("misc"),
            snacks: Symbol("snacks")
        }

        const dice = {
            d6: Symbol("d6"),
            d8: Symbol("d8"),
            d10: Symbol("d10"),
            d12: Symbol("d12"),
            d20: Symbol("d20")
        }


        /**
         * @type {Record<Symbol, HTMLElement>}
         */
        diceDropzones = {};

        /**
         * @type {Record<Symbol, HTMLElement>}
         */
        diceElements = {};

        document.addEventListener("DOMContentLoaded", init);

        function init() {
            initLevelListener();
            initDragNDrop();

            console.info("init ok at ", new Date());
        }

        function initLevelListener() {
            const level = document.querySelector("#level");

            level.addEventListener("change", () => {
                let value = Math.trunc(Number(level.value));

                if (value < 1) value = 1;
                if (value > 10) value = 10;

                level.value = value;
                state.level = value;
                document.getElementById('senority-rank-potions').innerText = value <= 5 ? '6' : '8';
            });

        }

        function initDragNDrop() {
            for (const dropzoneE of document.querySelectorAll(".dice-dropzone")) {
                const slot = diceslot[dropzoneE.dataset.slot];
                dropzoneE['slot-symbol'] = slot;

                if (!slot) {
                    throw new Error("Unknown slot: " + dropzone.dataset.slot);
                }

                diceDropzones[slot] = dropzoneE;

            }

            const box = diceslot.box;
            const boxE = diceDropzones[box];

            // need these in order
            for (const die of [dice.d6, dice.d8, dice.d10, dice.d12, dice.d20]) {
                const name = die.description;
                const dieE = document.createElement("span");
                dieE.className = "die " + name;
                dieE['die-symbol'] = die;

                const imgE = document.createElement("img");
                imgE.alt = name;
                imgE.src = name + ".png";
                imgE.draggable = false;

                dieE.appendChild(imgE);
                boxE.appendChild(dieE);

                state.diceAt[die] = box;
                diceElements[die] = dieE;

                dieE.addEventListener('pointerdown', e => dragStart(e, die, dieE));
            }

            document.addEventListener("pointermove", e => dragMove(e));
            document.addEventListener("pointerup", e => dragEnd(e));

            document.addEventListener("visibilitychange", e => {
                if (document.hidden) {
                    dragCancel(e);
                }
            });

            window.addEventListener("blur", e => {
                dragCancel(e);
            });


        }

        /** @type {Symbol | undefined} */
        var currentlyDragging = undefined;
        /** @type {HTMLSpanElement | undefined} */
        var hilightedDropzone = undefined;

        /**
         * @type {{dragging: boolean, die: Symbol|undefined, dieE: HTMLElement|undefined, originalParent: HTMLElement|undefined, originalNextSibling: HTMLElement|undefined, slot: Symbol|undefined, slotE: HTMLElement|undefined, xofset: number, yoffset: number}}
         */
        const dragState = {
            dragging: false,
            die: undefined,
            dieE: undefined,
            originalParent: undefined,
            originalNextSibling: undefined,
            slot: undefined,
            slotE: undefined,
            xoffset: 0,
            yoffset: 0,
        }


        /**
         * @param e {PointerEvent}
         * @param die {Symbol}
         * @param dieE {HTMLElement}
         */
        function dragStart(e, die, dieE) {
            if (dragState.dragging) dragCancel(e);

            clearDrag(); // unconditionally clear. Should already be clear, but meh.

            dragState.dragging = true;
            dragState.die = die;
            dragState.dieE = dieE;

            const rect = dieE.getBoundingClientRect();
            dragState.xoffset = e.clientX - rect.left;
            dragState.yoffset = e.clientY - rect.top;

            dieE.classList.add("dragging");

            dieE.style.left = `${e.clientX - dragState.xoffset}px`;
            dieE.style.top = `${e.clientY - dragState.yoffset}px`;

            dragState.originalParent = dieE.parentElement;
            dragState.originalNextSibling = dieE.nextSibling;
            document.getElementById("body").append(dieE);

            checkDropZone(e);

        }

        /**
         * @param e {PointerEvent}
         */
        function dragMove(e) {
            if (!dragState.dragging) return;
            e.cancelable && e.preventDefault();
            dragState.dieE.style.left = `${e.clientX - dragState.xoffset}px`;
            dragState.dieE.style.top = `${e.clientY - dragState.yoffset}px`;
            checkDropZone(e);
        }

        function checkDropZone(e) {
            if (!dragState.dragging) return;

            const element = document.elementFromPoint(e.x, e.y);
            const slot = element?.closest(".dice-dropzone")?.['slot-symbol'];

            if (slot !== dragState.slot) {
                if (dragState.slot) {
                    dragState.slotE.classList.remove("candrop");
                    dragState.slot = undefined;
                    dragState.slotE = undefined;
                }

                if (slot) {
                    dragState.slot = slot;
                    dragState.slotE = diceDropzones[dragState.slot];
                    dragState.slotE.classList.add("candrop");
                }
            }
        }

        /**
         * @param e {PointerEvent}
         */
        function dragEnd() {
            if (!dragState.dragging) return;

            try {
                if (!dragState.slot) {
                    moveDieToSlot(dragState.die, state.diceAt[dragState.die], dragState.originalNextSibling);
                } else {
                    if (dragState.slot !== diceslot.box && state.slotContains[dragState.slot] && state.slotContains[dragState.slot] !== dragState.die) {
                        moveDieToSlot(state.slotContains[dragState.slot], diceslot.box);
                    }

                    moveDieToSlot(dragState.die, dragState.slot);
                }
            } finally {
                clearDrag();
            }
        }

        function dragCancel() {
            if (!dragState.dragging) return;

            try {
                moveDieToSlot(dragState.die, state.diceAt[dragState.die], dragState.originalNextSibling);
            } finally {
                clearDrag();
            }
        }

        function clearDrag() {
            try {
                if (dragState.dieE) {
                    dragState.dieE.classList.remove("dragging")
                    dragState.dieE.classList.remove("candrop")
                    dragState.dieE.x = undefined;
                    dragState.dieE.y = undefined;
                }


                if (dragState.slotE) {
                    dragState.slotE.classList.remove("candrop")
                    dragState.slotE = undefined;
                }
            } finally {
                dragState.dragging = false;
                dragState.die = undefined;
                dragState.dieE = undefined;
                dragState.originalParent = undefined
                dragState.originalNextSibling = undefined;
                dragState.slot = undefined;
                dragState.slotE = undefined;
            }
        }

        function moveDieToSlot(die, slot, originalNextSibling = undefined) {

            if (!die || !slot) {
                throw new Error(`moveDieToSlot(${die?.description}, ${slot?.description}, ${originalNextSibling})`);
            }

            const dieE = diceElements[die];
            const slotE = diceDropzones[slot];

            if (slot !== diceslot.box && state.slotContains[slot] && state.slotContains[slot] !== die) {
                throw Error(`Can't move ${die} to ${slot} because slot contains ${state.slotContains[slot]}`)
            }

            state.slotContains[state.diceAt[die]] = undefined;
            state.slotContains[slot] = die;
            state.diceAt[die] = slot;
            if (originalNextSibling) {
                slotE.insertBefore(dieE, originalNextSibling);
            } else {
                slotE.appendChild(dieE);
            }
        }

        function rollDice() {

            const kitbag = document.getElementById("kitbag");

            kitbag.replaceChildren();

            const list = document.createElement("ul");
            kitbag.appendChild(list);

            for (const slot of [diceslot.melee, diceslot.missile, diceslot.armour, diceslot.misc, diceslot.snacks]) {
                if (!state.slotContains[slot]) continue;
                console.info("Rolling", slot, "with", state.slotContains[slot]);
                const die = Number(state.slotContains[slot].description.slice(1));
                const roll1 = Math.floor(Math.random() * die) + 1;
                const roll2 = Math.floor(Math.random() * die) + 1;
                let roll = 0;
                switch (state.bursarRelationship) {
                    case  'positive':
                        roll = Math.max(roll1, roll2);
                        break;
                    case 'negative':
                        roll = Math.min(roll1, roll2);
                        break;
                    default:
                        roll = roll1;
                        break;
                }

                console.info(`Rolled ${roll1}, ${roll2} , using ${roll}`);

                const rollE = document.createElement("span");
                rollE.classList.add('die-rolls');
                const roll1E = document.createElement("span");
                roll1E.classList.add('die-roll');
                const roll2E = document.createElement("span");
                roll2E.classList.add('die-roll');
                roll1E.innerText = roll1;
                roll2E.innerText = roll2;
                if (roll1 !== roll) roll1E.classList.add('not-used');
                if (roll2 !== roll) roll2E.classList.add('not-used');

                rollE.appendChild(document.createTextNode('('));
                rollE.appendChild(roll1E);
                if (state.bursarRelationship !== 'neutral') {
                    rollE.appendChild(document.createTextNode('/'));
                    rollE.appendChild(roll2E);
                }
                rollE.appendChild(document.createTextNode('+' + state.level + ')'));


                const template = document.getElementById('generated-' + slot.description);
                const spans = template.content.querySelectorAll("span.item");
                const span = spans[roll + Number(state.level)];

                console.log('rollE', rollE);
                console.log(template, span);

                const li = document.createElement("li");

                li.appendChild(rollE);
                li.appendChild(span.cloneNode(true));
                list.appendChild(li);
            }


        }

        function updateBursarRelationship() {
            const selected = document.querySelector(
                'input[name="bursarRelationship"]:checked'
            );

            state.bursarRelationship = selected.value;
        }

    </script>
